name: WinLRT Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/winlrt/desktop/**"
      - "core/src/ltr/**"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build core
        run: npm run build -w @nakliyeborsasi/core
      - name: Build WinLRT (NSIS)
        working-directory: apps/winlrt/desktop
        run: npm run tauri:build
      - name: Upload MSI/EXE
        uses: actions/upload-artifact@v4
        with:
          name: winlrt-windows-0.1.0
          path: |
            apps/winlrt/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/winlrt/desktop/src-tauri/target/release/bundle/msi/*.msi
