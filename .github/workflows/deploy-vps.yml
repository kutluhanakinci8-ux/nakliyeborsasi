name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_ekolojik_post_deploy:
        description: EK-LIVE post-deploy smoke/close atlanır
        type: boolean
        default: false

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: VPS secrets gate
        id: vps_gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -z "${VPS_HOST}" || -z "${VPS_SSH_KEY}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "SKIP: VPS secrets missing — use manual deploy (docs/EKOLojIK_MARKET_VPS_ROLLOUT.md)"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Deploy over SSH
        if: steps.vps_gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/nakliyeborsasi
            DEPLOY_BRANCH=main bash scripts/deploy-production-vps.sh /var/www/nakliyeborsasi

  ekolojik-post-deploy:
    needs: deploy
    if: >-
      always() && needs.deploy.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_ekolojik_post_deploy != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: EK-LIVE prod gate (smoke + EK-U4 close)
        env:
          EKOLOJIK_API_BASE: https://app.lerta.com.tr/api/v1
          EKOLOJIK_WEB_PUBLIC_URL: https://app.lerta.com.tr
          EK_U4_FULL: "0"
          EK_PROD_ROLLOUT_STRICT: "1"
        run: bash scripts/run-ekolojik-market-post-deploy-gate.sh
