name: WinLRT macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/winlrt/desktop/**"
      - "core/src/ltr/**"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build core
        run: npm run build -w @nakliyeborsasi/core
      - name: Build WinLRT (DMG)
        working-directory: apps/winlrt/desktop
        run: npm run tauri:build:mac
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: winlrt-macos-0.1.0
          path: |
            apps/winlrt/desktop/src-tauri/target/release/bundle/dmg/*.dmg
