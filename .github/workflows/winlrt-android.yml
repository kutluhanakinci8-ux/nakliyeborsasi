name: WinLRT Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/winlrt/mobile/**"
      - "core/src/ltr/**"

jobs:
  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build core + typecheck mobile
        run: npm run validate -w @lerta/winlrt-mobile
