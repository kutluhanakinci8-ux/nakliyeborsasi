<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LERTA Logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .lerta-logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }
        .lerta-svg-icon {
            width: 100%;
            height: auto;
            max-width: 320px;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.3));
        }
        .lerta-text {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 52px;
            font-weight: 400;
            color: #D4AF37;
            letter-spacing: 14px;
            margin-top: 15px;
            text-align: center;
            padding-left: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="lerta-logo-wrapper">
        <svg class="lerta-svg-icon" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 50 175 C 60 100, 160 60, 280 70 C 230 100, 180 115, 120 125 C 200 100, 260 90, 275 100 C 210 125, 170 145, 105 160 C 190 125, 260 120, 275 130 C 220 150, 160 170, 95 180 Z" />
                <path d="M 280 70 C 260 110, 230 150, 180 175 C 220 145, 255 125, 270 140 C 240 160, 200 180, 155 190 C 190 170, 230 155, 240 168 C 210 182, 170 195, 135 200" />
                <rect x="110" y="140" width="70" height="48" rx="4" transform="rotate(-12 145 164)" fill="none" stroke-width="3.5" />
                <path d="M 112 142 L 143 166 L 179 133" transform="rotate(-12 145 164)" fill="none" stroke-width="3.5" />
                <path d="M 185 145 A 18 18 0 0 1 188 172" stroke-width="3.5" />
            </g>
        </svg>
        <div class="lerta-text">LERTA</div>
    </div>
</body>
</html>
