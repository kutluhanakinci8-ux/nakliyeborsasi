[package]
name = "winlrt"
version = "0.1.0"
description = "WinLRT — Lerta Document viewer"
authors = ["Lerta"]
edition = "2021"

[[bin]]
name = "winlrt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
